<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<!-- Flags fixed: DZ / FR / GB -->
<title>Thika Auto .dz — سوق السيارات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',Tahoma,sans-serif
}

body{
  background:#f8fafc;
  color:#1e293b
}

[dir="ltr"] body{text-align:left}
[dir="rtl"] body{text-align:right}

header{
  background:#0f172a;
  color:#fff;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  position:sticky;
  top:0;
  z-index:50
}

header h1{
  font-size:19px
}

header h1 span{
  color:#facc15
}

.btn{
  background:#facc15;
  color:#0f172a;
  border:none;
  padding:9px 16px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  font-size:13px
}

.btn:hover{
  opacity:.92
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed
}

.btn-outline{
  background:transparent;
  color:#fff;
  border:1.5px solid #334155
}

.btn-delete{
  background:#fee2e2;
  color:#b91c1c;
  border:1px solid #fecaca
}

.header-actions{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap
}

.user-chip{
  background:#1e293b;
  padding:6px 12px;
  border-radius:20px;
  font-size:11px
}

.lang-switcher{
  display:flex;
  gap:6px
}

.lang-switcher button{
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:8px;
  padding:5px 9px;
  cursor:pointer;
  font-weight:700;
  font-size:12px
}

.flag-icon{
  display:block;
  width:30px;
  height:20px;
  border-radius:3px;
  box-shadow:0 0 0 1px rgba(0,0,0,.18);
  position:relative;
  overflow:hidden;
}
.flag-dz{
  background:linear-gradient(90deg,#006233 0 50%,#fff 50% 100%);
}
.flag-dz::before{
  content:"";
  position:absolute;
  width:9px;
  height:9px;
  left:12px;
  top:5px;
  border:2px solid #d21034;
  border-radius:50%;
  border-left-color:transparent;
  transform:rotate(-18deg);
}
.flag-dz::after{
  content:"★";
  position:absolute;
  left:14px;
  top:3px;
  color:#d21034;
  font-size:9px;
  line-height:14px;
}
.flag-fr{
  background:linear-gradient(90deg,#0055a4 0 33.333%,#fff 33.333% 66.666%,#ef4135 66.666% 100%);
}
.flag-gb{
  background:#012169;
}
.flag-gb::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 43%,#fff 43% 57%,transparent 57%),
    linear-gradient(0deg,transparent 35%,#fff 35% 65%,transparent 65%),
    linear-gradient(45deg,transparent 43%,#fff 43% 57%,transparent 57%),
    linear-gradient(-45deg,transparent 43%,#fff 43% 57%,transparent 57%);
}
.flag-gb::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 47%,#c8102e 47% 53%,transparent 53%),
    linear-gradient(0deg,transparent 40%,#c8102e 40% 60%,transparent 60%);
}

.lang-switcher button.active{
  background:#facc15;
  border-color:#facc15
}

.trust-bar{
  background:#f0fdf4;
  padding:8px 16px;
  display:flex;
  gap:14px;
  overflow:auto;
  font-size:11px;
  color:#166534;
  border-bottom:1px solid #bbf7d0
}

.trust-bar span{
  white-space:nowrap;
  font-weight:700
}

.hero{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:#fff;
  padding:30px 16px;
  text-align:center
}

.filters{
  background:#fff;
  padding:12px 16px;
  display:flex;
  gap:8px;
  overflow:auto;
  border-bottom:1px solid #e2e8f0
}

.advanced-filters{overflow:visible;flex-wrap:wrap;align-items:center}
.advanced-filters .filter-field{height:42px;margin:0}
.advanced-filters .filter-select{width:150px;min-width:150px}
.advanced-filters .filter-wilaya{width:185px;min-width:185px}
.advanced-filters .filter-search{flex:1 1 210px;min-width:190px}
.advanced-filters .filter-number{width:125px;min-width:115px}
.advanced-filters .filter-year{width:100px;min-width:95px}
.advanced-filters .filter-mileage{width:115px;min-width:105px}
.advanced-filters .filter-submit{height:42px;padding-inline:18px}
@media(max-width:700px){
  .advanced-filters{display:grid;grid-template-columns:1fr 1fr;overflow:visible}
  .advanced-filters .filter-field,.advanced-filters .filter-select,.advanced-filters .filter-wilaya,.advanced-filters .filter-search,.advanced-filters .filter-number,.advanced-filters .filter-year,.advanced-filters .filter-mileage,.advanced-filters .filter-submit{width:100%;min-width:0;flex:none}
  .advanced-filters .filter-search,.advanced-filters .filter-submit{grid-column:1/-1}
}

.advanced-filters{
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:visible;
  align-items:stretch;
}
.filter-row{display:grid;gap:8px;width:100%;}
.filter-row-top{grid-template-columns:1fr 1fr 1.5fr;}
.filter-row-bottom{grid-template-columns:1fr 1fr 1fr 1fr 1fr auto;}
.filter-row .filter-field{width:100%;min-width:0;}
.price-hint{text-align:center;color:#64748b;font-size:10px;font-weight:700;min-height:14px;}
@media(max-width:800px){
 .filter-row-top,.filter-row-bottom{grid-template-columns:1fr 1fr;}
 .filter-row-top .filter-search,.filter-row-bottom .filter-submit{grid-column:1/-1;}
}
@media(max-width:480px){
 .filter-row-top,.filter-row-bottom{grid-template-columns:1fr;}
 .filter-row-top .filter-search,.filter-row-bottom .filter-submit{grid-column:auto;}
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
  padding:16px
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
  border:2px solid #e2e8f0;
  position:relative
}

.card.featured{
  border-color:#facc15;
  box-shadow:0 5px 22px rgba(250,204,21,.25)
}

.card img{
  width:100%;
  height:170px;
  object-fit:cover;
  background:#e2e8f0
}

.card-body{
  padding:12px
}

.price{
  color:#16a34a;
  font-weight:900;
  font-size:17px
}

.meta{
  color:#64748b;
  font-size:11px;
  margin:3px 0
}

.badge{
  padding:3px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  display:inline-block;
  margin:2px;
  background:#dbeafe;
  color:#1e40af
}

.featured-badge{
  position:absolute;
  top:10px;
  inset-inline-start:10px;
  background:#facc15;
  color:#0f172a;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
  z-index:2
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
  padding:12px
}

.modal.active{
  display:flex
}

.modal-box{
  background:#fff;
  border-radius:18px;
  padding:22px;
  width:100%;
  max-width:440px;
  max-height:92vh;
  overflow:auto;
  position:relative
}

.close-x{
  position:absolute;
  top:12px;
  inset-inline-end:12px;
  background:#f1f5f9;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer
}

.input{
  width:100%;
  padding:12px;
  border:1.5px solid #cbd5e1;
  border-radius:10px;
  margin:7px 0;
  font-size:13px;
  background:#fff
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.note{
  background:#f0fdf4;
  border:1.5px solid #22c55e;
  border-radius:12px;
  padding:10px;
  margin:8px 0;
  font-size:11px
}

.pl{
  white-space:pre-line;
  font-size:12px;
  line-height:1.8
}

.chat-container{
  display:flex;
  flex-direction:column;
  height:460px
}

.chat-messages{
  flex:1;
  overflow:auto;
  padding:10px;
  background:#f1f5f9;
  border-radius:14px;
  margin-bottom:8px;
  display:flex;
  flex-direction:column;
  border:2px solid #e2e8f0
}

.msg{
  padding:10px 12px;
  border-radius:14px;
  margin:5px 0;
  max-width:82%;
  font-size:12px;
  word-break:break-word
}

.msg.other{
  background:#fff;
  border:1px solid #e2e8f0;
  align-self:flex-start
}

.msg.me{
  background:#0f172a;
  color:#fff;
  align-self:flex-end
}

.msg.system{
  background:#dcfce7;
  color:#166534;
  align-self:center;
  font-size:10px;
  text-align:center
}

.chat-ok,
.chat-error{
  padding:8px;
  border-radius:8px;
  margin:6px 0;
  font-size:12px
}

.chat-ok{
  color:#166534;
  background:#f0fdf4;
  border:1px solid #bbf7d0
}

.chat-error{
  color:#b91c1c;
  background:#fef2f2;
  border:1px solid #fecaca
}

.page{
  max-width:900px;
  margin:0 auto;
  padding:18px
}

.box{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  border:2px solid #e2e8f0
}

.box h3{
  margin-bottom:8px
}

.fab{
  position:fixed;
  bottom:20px;
  inset-inline-start:20px;
  z-index:55;
  width:50px;
  height:50px;
  border-radius:50%;
  border:none;
  font-size:22px;
  cursor:pointer;
  background:#EA4335;
  color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.3)
}

footer{
  background:#0f172a;
  color:#fff;
  padding:26px 16px 18px;
  margin-top:20px;
  font-size:12px
}

.footer-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:18px;
  max-width:900px;
  margin:0 auto
}

footer h4{
  color:#facc15;
  margin-bottom:8px;
  font-size:13px
}

footer .fcol a{
  display:block;
  color:#cbd5e1;
  text-decoration:none;
  margin:5px 0;
  cursor:pointer;
  font-size:12px
}

footer .fcol a:hover{
  color:#fff
}

footer .fcol p{
  color:#94a3b8;
  font-size:11px;
  line-height:1.7
}

footer .copy{
  text-align:center;
  border-top:1px solid #1e293b;
  margin-top:16px;
  padding-top:12px;
  font-size:11px;
  color:#64748b
}

footer a{
  color:#facc15;
  text-decoration:none;
  font-weight:800;
  margin:0 8px;
  cursor:pointer
}

/* ================================
   لوحة التحكم
================================ */

.dashboard-page{
  max-width:1180px;
  margin:0 auto;
  padding:18px
}

.dashboard-head{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap
}

.dashboard-head h2{
  font-size:22px;
  margin-bottom:5px
}

.dashboard-head p{
  color:#cbd5e1;
  font-size:12px
}

.dashboard-layout{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:16px;
  align-items:start
}

.dashboard-sidebar{
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:18px;
  padding:10px;
  position:sticky;
  top:80px
}

.dashboard-nav{
  width:100%;
  border:none;
  background:transparent;
  padding:12px;
  border-radius:11px;
  text-align:start;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
  color:#475569;
  margin-bottom:4px
}

.dashboard-nav:hover{
  background:#f1f5f9
}

.dashboard-nav.active{
  background:#0f172a;
  color:#fff
}

.dashboard-content{
  min-width:0
}

.dashboard-section{
  display:none
}

.dashboard-section.active{
  display:block
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:14px
}

.stat-card{
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:16px;
  padding:16px
}

.stat-card .icon{
  font-size:24px;
  margin-bottom:8px
}

.stat-card strong{
  display:block;
  font-size:22px;
  color:#0f172a
}

.stat-card span{
  color:#64748b;
  font-size:11px
}

.dashboard-box{
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px
}

.dashboard-box h3{
  margin-bottom:12px;
  font-size:15px
}

.dashboard-ad{
  display:flex;
  gap:12px;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:10px;
  margin-bottom:9px;
  align-items:center
}

.dashboard-ad img{
  width:95px;
  height:70px;
  object-fit:cover;
  border-radius:10px
}

.dashboard-ad-info{
  flex:1;
  min-width:0
}

.dashboard-ad-info strong{
  display:block;
  font-size:13px;
  margin-bottom:4px
}

.dashboard-ad-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap
}

.dashboard-ad-actions button{
  font-size:10px;
  padding:6px 9px
}

.dashboard-premium{
  background:linear-gradient(135deg,#fefce8,#fff7ed);
  border:2px solid #facc15;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px
}

.dashboard-premium h3{
  color:#92400e;
  margin-bottom:7px
}

.plan-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:12px
}

.plan-card{
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:16px;
  padding:16px;
  text-align:center;
  position:relative
}

.plan-card.popular{
  border-color:#facc15
}

.plan-card h4{
  font-size:15px;
  margin-bottom:7px
}

.plan-price{
  font-size:21px;
  font-weight:900;
  color:#16a34a;
  margin:8px 0
}

.plan-card ul{
  list-style:none;
  font-size:11px;
  color:#64748b;
  line-height:2;
  margin:8px 0 12px
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.profile-item{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:12px
}

.profile-item small{
  display:block;
  color:#64748b;
  font-size:10px;
  margin-bottom:4px
}

.profile-item strong{
  font-size:12px;
  word-break:break-word
}

.empty-dashboard{
  text-align:center;
  padding:35px 15px;
  color:#64748b;
  font-size:12px
}

.dashboard-message{
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:12px;
  margin-bottom:8px;
  background:#fff
}

.dashboard-message strong{
  font-size:12px
}

.dashboard-message p{
  font-size:11px;
  color:#475569;
  margin-top:5px
}

.dashboard-message small{
  font-size:9px;
  color:#94a3b8
}



/* ================= ADMIN DASHBOARD ================= */
.admin-page{
  max-width:1180px;
  margin:24px auto;
  padding:0 16px 40px
}
.admin-head{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  border-radius:20px;
  padding:24px;
  margin-bottom:16px
}
.admin-head h2{font-size:22px;margin-bottom:6px}
.admin-head p{font-size:12px;color:#cbd5e1}
.admin-layout{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:16px
}
.admin-sidebar{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:10px;
  height:max-content;
  position:sticky;
  top:90px
}
.admin-nav{
  width:100%;
  border:0;
  background:transparent;
  padding:11px 12px;
  border-radius:10px;
  text-align:start;
  cursor:pointer;
  font-weight:800;
  color:#475569;
  margin-bottom:4px
}
.admin-nav:hover{background:#f1f5f9}
.admin-nav.active{background:#0f172a;color:#fff}
.admin-content{
  min-width:0
}
.admin-section{display:none}
.admin-section.active{display:block}
.admin-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px
}
.admin-stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:14px
}
.admin-stat .icon{font-size:20px;margin-bottom:5px}
.admin-stat strong{display:block;font-size:22px}
.admin-stat span{font-size:10px;color:#64748b}
.admin-box{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:15px;
  margin-bottom:14px
}
.admin-box h3{font-size:15px;margin-bottom:12px}
.admin-toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px
}
.admin-toolbar input{flex:1;min-width:180px}
.admin-table-wrap{overflow:auto}
.admin-table{
  width:100%;
  border-collapse:collapse;
  font-size:11px
}
.admin-table th,
.admin-table td{
  border-bottom:1px solid #e2e8f0;
  padding:9px 7px;
  text-align:start;
  vertical-align:middle
}
.admin-table th{background:#f8fafc;color:#475569;font-size:10px}
.admin-table img{
  width:54px;height:40px;object-fit:cover;border-radius:8px
}
.admin-badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:999px;
  font-size:9px;
  font-weight:800;
  background:#f1f5f9
}
.admin-badge.featured{background:#fef3c7;color:#92400e}
.admin-danger{background:#fee2e2!important;color:#991b1b!important}
.admin-note{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  border-radius:12px;
  padding:11px;
  font-size:11px;
  margin-bottom:12px
}
.admin-muted{color:#64748b;font-size:11px}
.admin-user-card{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #e2e8f0
}
.admin-user-card:last-child{border-bottom:0}

@media(max-width:900px){
  .admin-layout{grid-template-columns:1fr}
  .admin-sidebar{position:static;display:flex;overflow:auto;gap:4px}
  .admin-nav{min-width:max-content;width:auto}
  .admin-stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:800px){
  .dashboard-layout{
    grid-template-columns:1fr
  }

  .dashboard-sidebar{
    position:static;
    display:flex;
    overflow:auto;
    gap:4px
  }

  .dashboard-nav{
    min-width:max-content;
    width:auto
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .plan-grid{
    grid-template-columns:1fr
  }
}

@media(max-width:520px){
  .grid{
    grid-template-columns:1fr
  }

  .row{
    grid-template-columns:1fr
  }

  .profile-grid{
    grid-template-columns:1fr
  }

  .dashboard-ad{
    align-items:flex-start
  }

  .dashboard-ad img{
    width:80px;
    height:60px
  }
}
</style>
</head>

<body>

<header>
<h1>🚗 <span>Thika Auto</span> .dz</h1>

<div class="header-actions" id="headerActions"></div>

<div class="lang-switcher" aria-label="Language">
<button type="button" data-lang="ar" onclick="setLanguage('ar')" aria-label="العربية" title="العربية"><span class="flag-icon flag-dz" aria-hidden="true"></span></button>
<button type="button" data-lang="fr" onclick="setLanguage('fr')" aria-label="Français" title="Français"><span class="flag-icon flag-fr" aria-hidden="true"></span></button>
<button type="button" data-lang="en" onclick="setLanguage('en')" aria-label="English" title="English"><span class="flag-icon flag-gb" aria-hidden="true"></span></button>
</div>
</header>

<div class="trust-bar">

const LANGS=["ar","fr","en"];

let currentLanguage=
localStorage.getItem("thika_language")||"ar";

function t(k,vars){

  const i=LANGS.indexOf(currentLanguage);

  let s=
    (D[k]&&D[k][i])||
    (D[k]&&D[k][0])||
    k;

  if(vars){

    for(const v in vars){

      s=s.replace(
        "{"+v+"}",
        vars[v]
      );

    }

  }

  return s;
}

function escapeHtml(v){

  return String(v??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

}

function catLabel(v){

  const c=CATEGORIES.find(c=>c.v===v);

  const i=LANGS.indexOf(currentLanguage);

  return c?(c.l[i]||c.l[0]):v;

}

function fillCategories(){

  const opts=CATEGORIES
    .map(c=>
      `<option value="${c.v}">
        ${catLabel(c.v)}
      </option>`
    )
    .join("");

  document.getElementById("filterCategory").innerHTML=
    `<option value="">
      ${escapeHtml(t("allCategories"))}
    </option>`+
    opts;

  document.getElementById("category").innerHTML=opts;

}

function fillWilayas(){

function setLanguage(lang){

  if(!LANGS.includes(lang))return;

  currentLanguage=lang;

  localStorage.setItem(
    "thika_language",
    lang
  );

  document.documentElement.lang=lang;

  document.documentElement.dir=
    lang==="ar"?"rtl":"ltr";

  document.title=t("title");

  document
    .querySelectorAll("[data-i18n]")
    .forEach(e=>{
      e.textContent=t(e.dataset.i18n);
    });

  document
    .querySelectorAll("[data-i18n-ph]")
    .forEach(e=>{
      e.placeholder=t(e.dataset.i18nPh);
    });

  document
    .querySelectorAll("[data-i18n-title]")
    .forEach(e=>{
      e.title=t(e.dataset.i18nTitle);
    });

  document
    .querySelectorAll(".lang-switcher button")
    .forEach(b=>{
      b.classList.toggle(
        "active",
        b.dataset.lang===lang
      );
    });

  fillCategories();
  fillWilayas();

  updateHeader();

  renderCars();

  if(currentUser){
    loadDashboard();
  }

}

  document
    .getElementById(id)
    .classList
    .add("active");

}

function closeModal(id){

  document
    .getElementById(id)
    .classList
    .remove("active");

}

function openAdd(){

  if(!currentUser){

    openModal("loginModal");

    return;
  }

  openModal("addModal");

}

function showPage(p){

  const pages=[
    "home",
    "archive",
    "policy",
    "dashboard",
    "admin"
  ];

  if(p==="admin" && !isAdmin){
    openModal("loginModal");
    alert(t("adminNotAllowed"));
    return;
  }

  pages.forEach(n=>{

    const el=
      document.getElementById(
        n+"Page"
      );

    if(el){

      el.style.display=
        n===p
        ?"block"
        :"none";

    }

  });

  window.scrollTo(0,0);

  if(p==="dashboard" && currentUser){

    loadDashboard();

  }

}

function showErr(id,msg,ok){

  const e=
    document.getElementById(id);

  e.innerText=msg;

  e.style.color=
    ok?"#166534":"#ef4444";

  e.style.display="block";

}

async function doLogin(){

  const email=
    document
      .getElementById("loginEmail")
      .value
      .trim()
      .toLowerCase();

  const pass=
    document
      .getElementById("loginPassword")
      .value;

  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
  ){

    return showErr(
      "loginError",
      t("badEmail")
    );

  }

  if(pass.length<6){

    return showErr(
      "loginError",
      t("shortPass")
    );

  }

  const{
    data,
    error
  }=
  await supabaseClient.auth.signInWithPassword({
    email,
    password:pass
  });

  if(error){

    return showErr(
      "loginError",
      /email not confirmed/i.test(error.message)
      ?t("emailNotConfirmed")
      :(error.message.includes("Invalid login")
        ?t("badLogin")
        :error.message)
    );

  }

  if(!data?.user?.email_confirmed_at && !data?.user?.confirmed_at){

    await supabaseClient.auth.signOut();

    return showErr(
      "loginError",
      t("emailNotConfirmed")
    );

  }

  currentUser=data.user;

  await refreshAdminStatus();

  closeModal("loginModal");

  updateHeader();

  await loadCars();

}

async function doSignup(){

  const username=
    document
      .getElementById("signupUsername")
      .value
      .trim();

  const name=
    document
      .getElementById("signupName")
      .value
      .trim();

  const phone=
    document
      .getElementById("signupPhone")
      .value
      .trim();

  const email=
    document
      .getElementById("signupEmail")
      .value
      .trim()
      .toLowerCase();

  const pass=
    document
      .getElementById("signupPassword")
      .value;

  if(
    !username||
    !name||
    !phone||
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||
    pass.length<6
  ){

    return showErr(
      "signupError",
      t("fillData")
    );

  }

  const{
    data,
    error
  }=
  await supabaseClient.auth.signUp({

    email,

    password:pass,

    options:{
      data:{
        full_name:name,
        username,
        phone
      }
    }

  });

  if(error){

    return showErr(
      "signupError",
      error.message
    );

  }

  /* لا نسمح بالدخول مباشرة بعد التسجيل.
     حتى لو أعاد Supabase جلسة بسبب إعدادات المشروع،
     نغلقها ونطلب تأكيد البريد أولاً. */
  if(data?.session){
    await supabaseClient.auth.signOut();
  }

  currentUser=null;
  isAdmin=false;
  updateHeader();

  showErr(
    "signupError",
    t("checkMail")+
      `\n\n<a href="#" onclick="resendConfirmationEmail();return false" style="color:#1e40af;font-weight:800">${t("resendConfirm")}</a>`,
    true
  );

  document.getElementById("signupError").innerHTML=
    t("checkMail")+
    `<br><br><a href="#" onclick="resendConfirmationEmail();return false" style="color:#1e40af;font-weight:800">${t("resendConfirm")}</a>`;

}

async function resendConfirmationEmail(){

  const email=document
    .getElementById("signupEmail")
    .value
    .trim()
    .toLowerCase();

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    return showErr("signupError",t("badEmail"));
  }

  const {error}=await supabaseClient.auth.resend({
    type:"signup",
    email,
    options:{emailRedirectTo:window.location.href}
  });

  if(error){
    return showErr("signupError",error.message);
  }

  showErr("signupError",t("confirmSent"),true);
}

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser=null;
  isAdmin=false;

  updateHeader();

  showPage("home");

  loadCars();

}

async function loadCars(){

  const{
    data,
    error
  }=
  await supabaseClient
    .from("cars")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );

  if(error){

    document.getElementById(
      "status"
    ).innerText=
      "❌ "+error.message;

    return;
  }

  carsCache=data;
  updatePriceGuide();

  renderCars();

  if(currentUser){

    loadDashboard();

  }

}

function applyFilters(){
  const input=document.getElementById("filterSearch");
  if(input && /@/.test(input.value)) input.value="";
  renderCars();
}

function updatePriceGuide(){
  const hint=document.getElementById("priceHint");
  if(!hint || !Array.isArray(carsCache) || !carsCache.length)return;
  const prices=carsCache.map(c=>Number(c.price)).filter(n=>Number.isFinite(n)&&n>0);
  if(!prices.length){hint.textContent="";return;}
  const min=Math.min(...prices);
  const max=Math.max(...prices);
  const money=n=>new Intl.NumberFormat("fr-DZ").format(n)+" دج";
  hint.textContent=`أقل سعر معلن: ${money(min)} • أعلى سعر معلن: ${money(max)}${max>3000000?" • توجد إعلانات فوق 3,000,000 دج":""}`;
}

function renderCars(){
  if(!carsCache)return;

  const cat=document.getElementById("filterCategory")?.value||"";
  const wilaya=document.getElementById("filterWilaya")?.value||"";
  const q=(document.getElementById("filterSearch")?.value||"").trim().toLowerCase();
  const minPrice=Math.max(0,Number(document.getElementById("filterMinPrice")?.value)||0);
  const maxPriceRaw=Number(document.getElementById("filterMaxPrice")?.value);
  const maxPrice=maxPriceRaw>0?maxPriceRaw:Infinity;
  const minYear=Math.max(0,Number(document.getElementById("filterMinYear")?.value)||0);
  const maxYearRaw=Number(document.getElementById("filterMaxYear")?.value);
  const maxYear=maxYearRaw>0?maxYearRaw:Infinity;
  const maxMileageRaw=Number(document.getElementById("filterMaxMileage")?.value);
  const maxMileage=maxMileageRaw>0?maxMileageRaw:Infinity;

  let list=carsCache.filter(c=>{
    const price=Number(c.price)||0;
    const year=Number(c.year)||0;
    const mileage=Number(c.mileage)||0;
    const haystack=[c.brand,c.model,c.description,c.wilaya,c.phone].filter(Boolean).join(" ").toLowerCase();
    return (!cat||c.category===cat)&&(!wilaya||c.wilaya===wilaya)&&(!q||haystack.includes(q))&&price>=minPrice&&price<=maxPrice&&year>=minYear&&year<=maxYear&&mileage<=maxMileage;
  });

  /* الإعلانات المميزة في المقدمة */
  list.sort((a,b)=>{

    const af=
      a.is_featured===true;

async function addCar(){

  if(!currentUser){

    openModal("loginModal");

    return;
  }

  const btn=
    document.getElementById(
      "publishBtn"
    );

  /* حدّ سبام بسيط: إعلان واحد لكل حساب خلال 24 ساعة.
     يجب دعم هذا أيضاً بسياسة/Trigger في Supabase للحماية من التحايل المباشر على API. */
  const since=new Date(Date.now()-24*60*60*1000).toISOString();
  const {data:recentAds,error:rateError}=await supabaseClient
    .from("cars")
    .select("id,created_at")
    .eq("user_id",currentUser.id)
    .gte("created_at",since)
    .limit(1);

  if(rateError){
    alert(rateError.message);
    return;
  }

  if(recentAds?.length){
    alert(t("oneAdPerDay"));
    return;
  }

  const files=
    Array.from(
      document.getElementById(
        "carImages"
      ).files
    ).slice(0,10);

  const v=id=>
    document
      .getElementById(id)
      .value
      .trim();

  const price=
    parseInt(v("price"));

  if(
    !v("brand")||
    !v("model")||
    !price||
    !v("wilaya")||
    !v("phone")
  ){

    alert(t("required"));

    return;
  }

  if(!files.length){

    alert(t("addImage"));

    return;
  }

  btn.disabled=true;

  btn.innerText=
    t("uploading");

  const urls=[];

  for(const f of files){

    const ext=
      f.name
        .split(".")
        .pop()
        .toLowerCase();

    const name=
      Date.now()+
      "-"+
      Math.random()
        .toString(36)
        .slice(2)+
      "."+
      ext;

    const{
      error
    }=
    await supabaseClient
      .storage
      .from("car-images")
      .upload(
        name,
        f
      );

    if(!error){

      urls.push(
        supabaseClient
          .storage
          .from("car-images")
          .getPublicUrl(name)
          .data
          .publicUrl
      );

    }

  }

  if(!urls.length){

    alert(t("uploadFail"));

    btn.disabled=false;

    btn.innerText=
      t("publish");

    return;
  }

  const{
    error
  }=
  await supabaseClient
    .from("cars")
    .insert({

      category:
        document
          .getElementById("category")
          .value||
        "cars",

      brand:v("brand"),

      model:v("model"),

      year:
        parseInt(v("year"))||
        null,

      mileage:
        parseInt(v("mileage"))||
        null,

      price,

      wilaya:v("wilaya"),

      fuel:
        v("fuel"),

      gearbox:
        v("gearbox"),

      phone:
        v("phone"),

      description:
        v("desc"),

      image_url:
        urls[0],

      images:
        urls,

      user_id:
        currentUser.id,

      seller_email:
        currentUser.email

      /*
        ملاحظة:
        لا نضع is_featured هنا.
        الإعلان العادي مجاني.
        الإعلان المميز يتم تفعيله
        بعد تأكيد الدفع من الخادم.
      */

    });

  btn.disabled=false;

  btn.innerText=
    t("publish");

  if(error){

    alert(/one ad every 24 hours/i.test(error.message)
      ?t("adRateError")
      :error.message);

    return;
  }

  closeModal("addModal");

  document.getElementById(
    "carImages"
  ).value="";

  loadCars();

  alert(t("published"));

}

async function openChat(carId,buyerId){
  forcedBuyerId=buyerId||null;
  if(!currentUser){ openModal("loginModal"); return; }

  const {data:car,error}=await supabaseClient
    .from("cars").select("*").eq("id",carId).single();
  if(error||!car){ alert(t("loadFail")); return; }

  currentChatCarId=car.id;
  currentCarData=car;
  currentChatBuyerId=null;
  document.getElementById("chatCarTitle").innerText=`${car.brand||""} ${car.model||""}`.trim();
  openModal("chatModal");

  const isSeller=car.user_id===currentUser.id;
  const wrap=document.getElementById("buyerSelectWrap");
  const select=document.getElementById("buyerSelect");
  if(isSeller){
    wrap.style.display="block";
    await loadBuyerConversations(car.id,buyerId||null);
  }else{
    wrap.style.display="none";
    currentChatBuyerId=currentUser.id;
    await loadConversationMessages(car.id,currentUser.id);
  }
}

async function loadBuyerConversations(carId,preferredBuyerId){
  const select=document.getElementById("buyerSelect");
  const box=document.getElementById("chatMessages");
  const {data,error}=await supabaseClient
    .from("messages")
    .select("buyer_id,buyer_email,sender_id,sender_name,message,created_at")
    .eq("car_id",carId)
    .eq("seller_id",currentUser.id)
    .order("created_at",{ascending:false});
  if(error){
    box.innerHTML=`<div class="chat-error">❌ ${escapeHtml(t("loadFail"))}: ${escapeHtml(error.message)}</div>`;
    return;
  }
  const map=new Map();
  (data||[]).forEach(m=>{
    if(!m.buyer_id||map.has(m.buyer_id)) return;
    map.set(m.buyer_id,m);
  });
  const buyers=[...map.entries()];
  if(!buyers.length){
    select.innerHTML=`<option value="">${escapeHtml(t("noBuyerChats"))}</option>`;
    currentChatBuyerId=null;
    box.innerHTML=`<div class="msg system">${escapeHtml(t("noBuyerChats"))}</div>`;
    return;
  }
  select.innerHTML=buyers.map(([id,m])=>{
    const label=m.sender_name||t("buyer");
    return `<option value="${escapeHtml(id)}">${escapeHtml(label)}</option>`;
  }).join("");
  const chosen=(preferredBuyerId&&map.has(preferredBuyerId))?preferredBuyerId:buyers[0][0];
  select.value=chosen;
  currentChatBuyerId=chosen;
  await loadConversationMessages(carId,chosen);
}

  }

    const mine=m.sender_id===currentUser.id;

async function sendMessage(){
  if(!currentUser){ openModal("loginModal"); return; }
  const input=document.getElementById("chatInput");
  const msg=input.value.trim();
  if(!msg||!currentCarData) return;
  const car=currentCarData;
  const sellerId=car.user_id;
  if(!sellerId){ alert(t("noSeller")); return; }
  const isSeller=sellerId===currentUser.id;
  let buyerId=isSeller?currentChatBuyerId:currentUser.id;
  if(!buyerId){ alert(t("waitBuyer")); return; }

  const senderEmail=(currentUser.email||"").toLowerCase();
  const buyerEmail=isSeller?null:senderEmail;
  const sellerEmail=(car.seller_email||"").toLowerCase() || (isSeller?senderEmail:"");
  const senderName=currentUser.user_metadata?.username||currentUser.user_metadata?.full_name||currentUser.email||t("other");

  // نجلب بريد الطرف الآخر من رسالة سابقة في نفس المحادثة، إن وجد، بدون عرضه للمستخدم.
  let resolvedBuyerEmail=buyerEmail||"";
  let resolvedSellerEmail=sellerEmail||"";
  if(isSeller){
    const {data:prev,error:pe}=await supabaseClient.from("messages")
      .select("buyer_email,seller_email").eq("car_id",car.id).eq("buyer_id",buyerId).limit(1);
    if(pe){ alert(t("sendFail")+": "+pe.message); return; }
    resolvedBuyerEmail=prev?.[0]?.buyer_email||"";
    resolvedSellerEmail=senderEmail;
  }
  if(!resolvedBuyerEmail && !isSeller){ resolvedBuyerEmail=senderEmail; }

  const payload={
    car_id:car.id,
    sender_id:currentUser.id,
    buyer_id:buyerId,
    seller_id:sellerId,
    sender_name:senderName,
    buyer_email:resolvedBuyerEmail,
    seller_email:resolvedSellerEmail,
    message:msg,
    is_seller:isSeller
  };
  const {error}=await supabaseClient.from("messages").insert(payload);
  if(error){ alert(t("sendFail")+": "+error.message); return; }
  currentChatBuyerId=buyerId;
  input.value="";
  await loadConversationMessages(car.id,buyerId);
}

async function saveCarEdit(){
  if(!currentUser || !editingCarId) return;

  const v=id=>document.getElementById(id).value.trim();
  const price=parseInt(v("price"));

  if(!v("brand")||!v("model")||!price||price<=0||!v("wilaya")||!v("phone")){
    alert(t("required"));
    return;
  }

  const btn=document.getElementById("publishBtn");
  btn.disabled=true;

  const {error}=await supabaseClient
    .from("cars")
    .update({
      category:v("category")||"cars",
      brand:v("brand"),
      model:v("model"),
      year:parseInt(v("year"))||null,
      mileage:parseInt(v("mileage"))||null,
      price,
      wilaya:v("wilaya"),
      fuel:v("fuel"),
      gearbox:v("gearbox"),
      phone:v("phone"),
      description:v("desc")
    })
    .eq("id",editingCarId)
    .eq("user_id",currentUser.id);

  btn.disabled=false;

  if(error){
    alert(t("editFail"));
    return;
  }

  closeModal("addModal");
  resetAddForm();
  await loadCars();
  alert(t("editedOk"));
}

const PHOTO_SLOTS=[
  {k:"front",    l:["أمامية","Avant","Front"]},
  {k:"rear",     l:["خلفية","Arrière","Rear"]},
  {k:"top",      l:["من الأعلى","Vue du dessus","Top view"]},

  {k:"engine",   l:["المحرك","Moteur","Engine"]}
];

const PHOTO_MAX_SIDE=1280;
const PHOTO_QUALITY=0.8;
const PHOTO_MAX_INPUT=25*1024*1024;
const PHOTO_TYPES=["image/jpeg","image/png","image/webp"];

let slotFiles={};
let slotPreviewUrls={};

/* السيارات والشاحنات: كل الخانات إلزامية. غيرها: الأمامية فقط */
function requiredSlots(cat){
  return (cat==="cars"||cat==="trucks")
    ? PHOTO_SLOTS.map(s=>s.k)
    : ["front"];
}

function slotLabel(slot){
  const i=LANGS.indexOf(currentLanguage);
  return slot.l[i]||slot.l[0];
}

/* ---------- بناء الواجهة ---------- */
(function buildPhotoSlots(){
  const oldInput=document.getElementById("carImages");
  if(!oldInput) return;
  const oldBox=oldInput.parentElement;
  oldBox.style.display="none";

  const css=document.createElement("style");
  css.textContent=`
    #photoSlotsWrap{background:#f0fdf4;padding:12px;border-radius:12px;border:2px dashed #22c55e;margin:10px 0}
    #photoSlotsWrap .ps-title{font-weight:900;display:block;margin-bottom:4px}
    #photoSlotsWrap .ps-hint{font-size:10px;color:#64748b;margin-bottom:8px}
    .ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .photo-slot{position:relative;display:flex;align-items:flex-end;justify-content:center;height:96px;border:1.5px solid #cbd5e1;border-radius:10px;background:#fff;overflow:hidden;cursor:pointer}
    .photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
    .photo-slot.has-img img{display:block}
    .photo-slot .ps-label{position:relative;z-index:1;width:100%;text-align:center;font-size:11px;font-weight:800;padding:5px 4px;background:rgba(255,255,255,.9)}
    .photo-slot:not(.has-img) .ps-label{background:transparent;align-self:center;font-size:12px;color:#475569}
    .photo-slot.missing{border-color:#ef4444}
  `;
  document.head.appendChild(css);

  const wrap=document.createElement("div");
  wrap.id="photoSlotsWrap";
  wrap.innerHTML=`
    <span class="ps-title" id="psTitle"></span>
    <div class="ps-hint" id="psHint"></div>
    <div class="ps-grid">
      ${PHOTO_SLOTS.map(s=>`
        <label class="photo-slot" id="slot_${s.k}">
          <input type="file" accept="image/jpeg,image/png,image/webp" hidden data-slot="${s.k}">
          <img alt="">
          <span class="ps-label"></span>
        </label>`).join("")}
    </div>`;
  oldBox.parentNode.insertBefore(wrap,oldBox);

  wrap.querySelectorAll("input[type=file]").forEach(inp=>{
    inp.addEventListener("change",()=>onSlotChange(inp));
  });

  const cat=document.getElementById("category");
  if(cat) cat.addEventListener("change",updateSlotLabels);

  updateSlotLabels();
})();

function updateSlotLabels(){
  const title=document.getElementById("psTitle");
  const hint=document.getElementById("psHint");
  if(title) title.textContent=t("photoSlotsTitle");
  if(hint) hint.textContent=t("photoSlotsHint");
  const req=requiredSlots(document.getElementById("category")?.value||"cars");
  PHOTO_SLOTS.forEach(s=>{
    const el=document.querySelector("#slot_"+s.k+" .ps-label");
    if(el) el.textContent="📷 "+slotLabel(s)+(req.includes(s.k)?" *":"");
  });
}

function onSlotChange(inp){
  const k=inp.dataset.slot;
  const file=inp.files[0];
  const box=document.getElementById("slot_"+k);
  if(!file){ clearSlot(k); return; }

  if(!PHOTO_TYPES.includes(file.type)){
    alert(t("photoBadType"));
    inp.value="";
    return;
  }
  if(file.size>PHOTO_MAX_INPUT){
    alert(t("photoTooBig"));
    inp.value="";
    return;
  }

  slotFiles[k]=file;
  if(slotPreviewUrls[k]) URL.revokeObjectURL(slotPreviewUrls[k]);
  slotPreviewUrls[k]=URL.createObjectURL(file);
  box.querySelector("img").src=slotPreviewUrls[k];
  box.classList.add("has-img");
  box.classList.remove("missing");
}

function clearSlot(k){
  delete slotFiles[k];
  if(slotPreviewUrls[k]){ URL.revokeObjectURL(slotPreviewUrls[k]); delete slotPreviewUrls[k]; }
  const box=document.getElementById("slot_"+k);
  if(!box) return;
  box.classList.remove("has-img","missing");
  box.querySelector("img").removeAttribute("src");
  box.querySelector("input").value="";
}

function clearAllSlots(){
  PHOTO_SLOTS.forEach(s=>clearSlot(s.k));
}

function showPhotoSlots(show){
  const w=document.getElementById("photoSlotsWrap");
  if(w) w.style.display=show?"block":"none";
}

/* ---------- ضغط الصورة داخل المتصفح ---------- */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const scale=Math.min(1,PHOTO_MAX_SIDE/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale));
      const h=Math.max(1,Math.round(img.height*scale));
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#fff";
      ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(
        b=>b?resolve(b):reject(new Error("compress")),
        "image/jpeg",
        PHOTO_QUALITY
      );
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("load")); };
    img.src=url;
  });
}

  updateSlotLabels();
};

/* ---------- addCar الجديدة: صور محددة + ضغط ---------- */
addCar=async function(){
  if(!currentUser){ openModal("loginModal"); return; }

  const btn=document.getElementById("publishBtn");
  const v=id=>document.getElementById(id).value.trim();
  const price=parseInt(v("price"));
  const category=v("category")||"cars";

  if(!v("brand")||!v("model")||!price||price<=0||!v("wilaya")||!v("phone")){
    alert(t("required"));
    return;
  }

  /* الصور الإلزامية */
  const req=requiredSlots(category);
  const missing=req.filter(k=>!slotFiles[k]);
  if(missing.length){
    PHOTO_SLOTS.forEach(s=>{
      document.getElementById("slot_"+s.k).classList.toggle("missing",missing.includes(s.k));
    });
    const names=PHOTO_SLOTS.filter(s=>missing.includes(s.k)).map(slotLabel).join(" ، ");
    alert(t("photoMissing")+"\n"+names);
    return;
  }

  /* حد إعلان كل 24 ساعة (الأدمن مستثنى، والخادم يفرضه أيضاً) */
  if(!isAdmin){
    const since=new Date(Date.now()-24*60*60*1000).toISOString();
    const {data:recent,error:rateError}=await supabaseClient
      .from("cars").select("id")
      .eq("user_id",currentUser.id)
      .gte("created_at",since).limit(1);
    if(rateError){ alert(rateError.message); return; }
    if(recent?.length){ alert(t("oneAdPerDay")); return; }
  }

  btn.disabled=true;

  /* ضغط ثم رفع بالترتيب الثابت للخانات */
  const keys=PHOTO_SLOTS.map(s=>s.k).filter(k=>slotFiles[k]);
  const urls=[];

  try{
    for(let i=0;i<keys.length;i++){
      btn.textContent=t("uploading")+" "+(i+1)+"/"+keys.length;
      const blob=await compressImage(slotFiles[keys[i]]);
      const name=Date.now()+"-"+keys[i]+"-"+Math.random().toString(36).slice(2)+".jpg";
      const {error:upErr}=await supabaseClient.storage
        .from("car-images")
        .upload(name,blob,{contentType:"image/jpeg"});
      if(upErr) throw upErr;
      urls.push(
        supabaseClient.storage.from("car-images").getPublicUrl(name).data.publicUrl
      );
    }
  }catch(e){
    btn.disabled=false;
    btn.textContent=t("publish");
    alert(t("photoUploadFail"));
    return;
  }

  const {error}=await supabaseClient.from("cars").insert({
    category,
    brand:v("brand"),
    model:v("model"),
    year:parseInt(v("year"))||null,
    mileage:parseInt(v("mileage"))||null,
    price,
    wilaya:v("wilaya"),
    fuel:v("fuel"),
    gearbox:v("gearbox"),
    phone:v("phone"),
    description:v("desc"),
    image_url:urls[0],
    images:urls,
    user_id:currentUser.id,
    seller_email:currentUser.email
  });

  btn.disabled=false;
  btn.textContent=t("publish");

  if(error){
    alert(/one ad every 24 hours/i.test(error.message)?t("adRateError"):error.message);
    return;
  }

  closeModal("addModal");
  clearAllSlots();
  await loadCars();
  alert(t("published"));
};
initAuth().then(
  loadCars
);
supabaseClient
  .auth
  .onAuthStateChange(
    async (_e,s)=>{

      const id=
        s?.user?.id||
        null;

      if(
        id!==
        (currentUser?.id||null)
      ){

        currentUser=
          s?.user||null;

        await refreshAdminStatus();

        updateHeader();

        loadCars();

      }

      if(
        _e===
        "PASSWORD_RECOVERY"
      ){

        openModal(
          "resetModal"
        );

      }

    }
  );

</script>
