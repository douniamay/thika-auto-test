<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thika Auto .dz — سوق السيارات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',Tahoma,sans-serif
}

body{
  background:#f8fafc;
  color:#1e293b
}

[dir="ltr"] body{text-align:left}
[dir="rtl"] body{text-align:right}

header{
  background:#0f172a;
  color:#fff;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  position:sticky;
  top:0;
  z-index:50
}

header h1{
  font-size:19px
}

header h1 span{
  color:#facc15
}

.btn{
  background:#facc15;
  color:#0f172a;
  border:none;
  padding:9px 16px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  font-size:13px
}

.btn:hover{
  opacity:.92
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed
}

.btn-outline{
  background:transparent;
  color:#fff;
  border:1.5px solid #334155
}

.btn-delete{
  background:#fee2e2;
  color:#b91c1c;
  border:1px solid #fecaca
}

.header-actions{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap
}

.user-chip{
  background:#1e293b;
  padding:6px 12px;
  border-radius:20px;
  font-size:11px
}

.lang-switcher{
  display:flex;
  gap:6px
}

.lang-switcher button{
  border:1px solid #d1d5db;
  background:#fff;
  border-radius:8px;
  padding:5px 9px;
  cursor:pointer;
  font-weight:700;
  font-size:12px
}

.lang-switcher button.active{
  background:#facc15;
  border-color:#facc15
}

.trust-bar{
  background:#f0fdf4;
  padding:8px 16px;
  display:flex;
  gap:14px;
  overflow:auto;
  font-size:11px;
  color:#166534;
  border-bottom:1px solid #bbf7d0
}

.trust-bar span{
  white-space:nowrap;
  font-weight:700
}

.hero{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:#fff;
  padding:30px 16px;
  text-align:center
}

.filters{
  background:#fff;
  padding:12px 16px;
  display:flex;
  gap:8px;
  overflow:auto;
  border-bottom:1px solid #e2e8f0
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
  padding:16px
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
  border:2px solid #e2e8f0;
  position:relative
}

.card.featured{
  border-color:#facc15;
  box-shadow:0 5px 22px rgba(250,204,21,.25)
}

.card img{
  width:100%;
  height:170px;
  object-fit:cover;
  background:#e2e8f0
}

.card-body{
  padding:12px
}

.price{
  color:#16a34a;
  font-weight:900;
  font-size:17px
}

.meta{
  color:#64748b;
  font-size:11px;
  margin:3px 0
}

.badge{
  padding:3px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  display:inline-block;
  margin:2px;
  background:#dbeafe;
  color:#1e40af
}

.featured-badge{
  position:absolute;
  top:10px;
  inset-inline-start:10px;
  background:#facc15;
  color:#0f172a;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:900;
  z-index:2
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
  padding:12px
}

.modal.active{
  display:flex
}

.modal-box{
  background:#fff;
  border-radius:18px;
  padding:22px;
  width:100%;
  max-width:440px;
  max-height:92vh;
  overflow:auto;
  position:relative
}

.close-x{
  position:absolute;
  top:12px;
  inset-inline-end:12px;
  background:#f1f5f9;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer
}

.input{
  width:100%;
  padding:12px;
  border:1.5px solid #cbd5e1;
  border-radius:10px;
  margin:7px 0;
  font-size:13px;
  background:#fff
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.note{
  background:#f0fdf4;
  border:1.5px solid #22c55e;
  border-radius:12px;
  padding:10px;
  margin:8px 0;
  font-size:11px
}

.pl{
  white-space:pre-line;
  font-size:12px;
  line-height:1.8
}

.chat-container{
  display:flex;
  flex-direction:column;
  height:460px
}

.chat-messages{
  flex:1;
  overflow:auto;
  padding:10px;
  background:#f1f5f9;
  border-radius:14px;
  margin-bottom:8px;
  display:flex;
  flex-direction:column;
  border:2px solid #e2e8f0
}

.msg{
  padding:10px 12px;
  border-radius:14px;
  margin:5px 0;
  max-width:82%;
  font-size:12px;
  word-break:break-word
}

.msg.other{
  background:#fff;
  border:1px solid #e2e8f0;
  align-self:flex-start
}

.msg.me{
  background:#0f172a;
  color:#fff;
  align-self:flex-end
}

.msg.system{
  background:#dcfce7;
  color:#166534;
  align-self:center;
  font-size:10px;
  text-align:center
}

.chat-ok,
.chat-error{
  padding:8px;
  border-radius:8px;
  margin:6px 0;
  font-size:12px
}

.chat-ok{
  color:#166534;
  background:#f0fdf4;
  border:1px solid #bbf7d0
}

.chat-error{
  color:#b91c1c;
  background:#fef2f2;
  border:1px solid #fecaca
}

.page{
  max-width:900px;
  margin:0 auto;
  padding:18px
}

.box{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  border:2px solid #e2e8f0
}

.box h3{
  margin-bottom:8px
}

.fab{
  position:fixed;
  bottom:20px;
  inset-inline-start:20px;
  z-index:55;
  width:50px;
  height:50px;
  border-radius:50%;
  border:none;
  font-size:22px;
  cursor:pointer;
  background:#EA4335;
  color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.3)
}

footer{
  background:#0f172a;
  color:#fff;
  padding:26px 16px 18px;
  margin-top:20px;
  font-size:12px
}

.footer-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:18px;
  max-width:900px;
  margin:0 auto
}

footer h4{
  color:#facc15;
  margin-bottom:8px;
  font-size:13px
}

footer .fcol a{
  display:block;
  color:#cbd5e1;
  text-decoration:none;
  margin:5px 0;
  cursor:pointer;
  font-size:12px
}

footer .fcol a:hover{
  color:#fff
}

footer .fcol p{
  color:#94a3b8;
  font-size:11px;
  line-height:1.7
}

footer .copy{
  text-align:center;
  border-top:1px solid #1e293b;
  margin-top:16px;
  padding-top:12px;
  font-size:11px;
  color:#64748b
}

footer a{
  color:#facc15;
  text-decoration:none;
  font-weight:800;
  margin:0 8px;
  cursor:pointer
}

/* ================================
   لوحة التحكم
================================ */

.dashboard-page{
  max-width:1180px;
  margin:0 auto;
  padding:18px
}

.dashboard-head{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap
}

.dashboard-head h2{
  font-size:22px;
  margin-bottom:5px
}

.dashboard-head p{
  color:#cbd5e1;
  font-size:12px
}

.dashboard-layout{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:16px;
  align-items:start
}

.dashboard-sidebar{
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:18px;
  padding:10px;
  position:sticky;
  top:80px
}

.dashboard-nav{
  width:100%;
  border:none;
  background:transparent;
  padding:12px;
  border-radius:11px;
  text-align:start;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
  color:#475569;
  margin-bottom:4px
}

.dashboard-nav:hover{
  background:#f1f5f9
}

.dashboard-nav.active{
  background:#0f172a;
  color:#fff
}

.dashboard-content{
  min-width:0
}

.dashboard-section{
  display:none
}

.dashboard-section.active{
  display:block
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:14px
}

.stat-card{
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:16px;
  padding:16px
}

.stat-card .icon{
  font-size:24px;
  margin-bottom:8px
}

.stat-card strong{
  display:block;
  font-size:22px;
  color:#0f172a
}

.stat-card span{
  color:#64748b;
  font-size:11px
}

.dashboard-box{
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px
}

.dashboard-box h3{
  margin-bottom:12px;
  font-size:15px
}

.dashboard-ad{
  display:flex;
  gap:12px;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:10px;
  margin-bottom:9px;
  align-items:center
}

.dashboard-ad img{
  width:95px;
  height:70px;
  object-fit:cover;
  border-radius:10px
}

.dashboard-ad-info{
  flex:1;
  min-width:0
}

.dashboard-ad-info strong{
  display:block;
  font-size:13px;
  margin-bottom:4px
}

.dashboard-ad-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap
}

.dashboard-ad-actions button{
  font-size:10px;
  padding:6px 9px
}

.dashboard-premium{
  background:linear-gradient(135deg,#fefce8,#fff7ed);
  border:2px solid #facc15;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px
}

.dashboard-premium h3{
  color:#92400e;
  margin-bottom:7px
}

.plan-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:12px
}

.plan-card{
  background:#fff;
  border:2px solid #e2e8f0;
  border-radius:16px;
  padding:16px;
  text-align:center;
  position:relative
}

.plan-card.popular{
  border-color:#facc15
}

.plan-card h4{
  font-size:15px;
  margin-bottom:7px
}

.plan-price{
  font-size:21px;
  font-weight:900;
  color:#16a34a;
  margin:8px 0
}

.plan-card ul{
  list-style:none;
  font-size:11px;
  color:#64748b;
  line-height:2;
  margin:8px 0 12px
}

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.profile-item{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:12px
}

.profile-item small{
  display:block;
  color:#64748b;
  font-size:10px;
  margin-bottom:4px
}

.profile-item strong{
  font-size:12px;
  word-break:break-word
}

.empty-dashboard{
  text-align:center;
  padding:35px 15px;
  color:#64748b;
  font-size:12px
}

.dashboard-message{
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:12px;
  margin-bottom:8px;
  background:#fff
}

.dashboard-message strong{
  font-size:12px
}

.dashboard-message p{
  font-size:11px;
  color:#475569;
  margin-top:5px
}

.dashboard-message small{
  font-size:9px;
  color:#94a3b8
}

@media(max-width:800px){
  .dashboard-layout{
    grid-template-columns:1fr
  }

  .dashboard-sidebar{
    position:static;
    display:flex;
    overflow:auto;
    gap:4px
  }

  .dashboard-nav{
    min-width:max-content;
    width:auto
  }

  .stats-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .plan-grid{
    grid-template-columns:1fr
  }
}

@media(max-width:520px){
  .grid{
    grid-template-columns:1fr
  }

  .row{
    grid-template-columns:1fr
  }

  .profile-grid{
    grid-template-columns:1fr
  }

  .dashboard-ad{
    align-items:flex-start
  }

  .dashboard-ad img{
    width:80px;
    height:60px
  }
}
</style>
</head>

<body>

<header>
<h1>🚗 <span>Thika Auto</span> .dz</h1>

<div class="header-actions" id="headerActions"></div>

<div class="lang-switcher">
<button type="button" data-lang="ar" onclick="setLanguage('ar')">🇩🇿 العربية</button>
<button type="button" data-lang="fr" onclick="setLanguage('fr')">🇫🇷 Français</button>
<button type="button" data-lang="en" onclick="setLanguage('en')">🇬🇧 English</button>
</div>
</header>

<div class="trust-bar">
<span data-i18n="trust1"></span>
<span data-i18n="trust2"></span>
<span data-i18n="trust3"></span>
</div>

<!-- ================= HOME ================= -->

<div id="homePage" class="view">

<div class="hero">
<h2 style="font-size:20px" data-i18n="heroTitle"></h2>

<p style="font-size:12px;margin-top:6px;opacity:.9" data-i18n="heroText"></p>

<p id="status"
style="margin-top:10px;font-size:11px;opacity:.75"
data-i18n="loading"></p>
</div>

<div class="filters">

<select id="filterCategory"
class="input"
style="margin:0;min-width:150px"
onchange="renderCars()">
</select>

<select id="filterWilaya"
class="input"
style="margin:0;min-width:160px"
onchange="renderCars()">
</select>

<input
id="filterSearch"
class="input"
name="carSearchQuery"
autocomplete="off"
data-i18n-ph="search"
style="margin:0;flex:1;min-width:140px"
oninput="renderCars()">

<button
class="btn"
onclick="renderCars()"
style="white-space:nowrap"
data-i18n="filter">
</button>

</div>

<p
style="padding:8px 16px;text-align:center;color:#64748b;font-size:11px"
data-i18n="ownerHelp">
</p>

<div class="grid" id="carsGrid"></div>

</div>

<!-- ================= ARCHIVE ================= -->

<div id="archivePage" class="page view" style="display:none">

<h2 data-i18n="archiveTitle"></h2>

<div class="note" data-i18n="archiveInfo"></div>

<div class="box">

<input
class="input"
id="archiveSearch"
data-i18n-ph="archivePh">

<button
class="btn"
onclick="searchArchive()"
data-i18n="archiveBtn">
</button>

<div id="archiveResults" style="margin-top:12px"></div>

</div>

<button
class="btn"
onclick="showPage('home')"
data-i18n="back">
</button>

</div>

<!-- ================= POLICY ================= -->

<div id="policyPage" class="page view" style="display:none">

<h2 data-i18n="policyTitle"></h2>

<div class="box">
<h3 data-i18n="pol1t"></h3>
<p class="pl" data-i18n="pol1b"></p>
</div>

<div class="box">
<h3 data-i18n="pol2t"></h3>
<p class="pl" data-i18n="pol2b"></p>
</div>

<div class="box">
<h3 data-i18n="pol3t"></h3>
<p class="pl" data-i18n="pol3b"></p>
</div>

<button
class="btn"
onclick="showPage('home')"
data-i18n="back">
</button>

</div>

<!-- ================= DASHBOARD ================= -->

<div id="dashboardPage" class="dashboard-page view" style="display:none">

<div class="dashboard-head">

<div>
<h2>📊 <span data-i18n="dashboardTitle"></span></h2>
<p data-i18n="dashboardWelcome"></p>
</div>

<button
class="btn"
onclick="openAdd()"
data-i18n="addBtn">
</button>

</div>

<div class="dashboard-layout">

<aside class="dashboard-sidebar">

<button
class="dashboard-nav active"
onclick="dashboardTab('overview',this)"
data-i18n="dashOverview">
</button>

<button
class="dashboard-nav"
onclick="dashboardTab('myAds',this)"
data-i18n="dashAds">
</button>

<button
class="dashboard-nav"
onclick="dashboardTab('messages',this)"
data-i18n="dashMessages">
</button>

<button
class="dashboard-nav"
onclick="dashboardTab('premium',this)"
data-i18n="dashPremium">
</button>

<button
class="dashboard-nav"
onclick="dashboardTab('profile',this)"
data-i18n="dashProfile">
</button>

<button
class="dashboard-nav"
onclick="showPage('archive')"
data-i18n="archiveShort">
</button>

</aside>

<main class="dashboard-content">

<!-- OVERVIEW -->

<section
id="dashOverview"
class="dashboard-section active">

<div class="stats-grid">

<div class="stat-card">
<div class="icon">🚗</div>
<strong id="dashAdsCount">0</strong>
<span data-i18n="statAds"></span>
</div>

<div class="stat-card">
<div class="icon">💬</div>
<strong id="dashMessagesCount">0</strong>
<span data-i18n="statMessages"></span>
</div>

<div class="stat-card">
<div class="icon">⭐</div>
<strong id="dashFeaturedCount">0</strong>
<span data-i18n="statFeatured"></span>
</div>

<div class="stat-card">
<div class="icon">👤</div>
<strong id="dashAccountStatus">✓</strong>
<span data-i18n="statAccount"></span>
</div>

</div>

<div class="dashboard-premium">

<h3>⭐ <span data-i18n="premiumTitle"></span></h3>

<p
style="font-size:12px;color:#78350f"
data-i18n="premiumText">
</p>

<button
class="btn"
style="margin-top:10px"
onclick="dashboardTab('premium')"
data-i18n="seePlans">
</button>

</div>

<div class="dashboard-box">

<h3 data-i18n="recentAds"></h3>

<div id="dashboardRecentAds"></div>

</div>

</section>

<!-- MY ADS -->

<section
id="dashMyAds"
class="dashboard-section">

<div class="dashboard-box">

<h3 data-i18n="myAdsTitle"></h3>

<div
id="dashboardAdsList">
</div>

</div>

</section>

<!-- MESSAGES -->

<section
id="dashMessages"
class="dashboard-section">

<div class="dashboard-box">

<h3 data-i18n="myMessagesTitle"></h3>

<div
id="dashboardMessagesList">
</div>

</div>

</section>

<!-- PREMIUM -->

<section
id="dashPremium"
class="dashboard-section">

<div class="dashboard-box">

<h3>⭐ <span data-i18n="premiumPlans"></span></h3>

<p
style="font-size:11px;color:#64748b"
data-i18n="premiumExplain">
</p>

<div class="plan-grid">

<div class="plan-card popular">

<div class="badge">⭐</div>

<h4 data-i18n="individualPlan"></h4>

<div class="plan-price">
<span data-i18n="priceContact"></span>
</div>

<ul>
<li data-i18n="individualFeature1"></li>
<li data-i18n="individualFeature2"></li>
<li data-i18n="individualFeature3"></li>
</ul>

<button
class="btn"
onclick="startPremium('individual')"
data-i18n="choosePlan">
</button>

</div>

<div class="plan-card">

<h4>🥈 <span data-i18n="silverPlan"></span></h4>

<div class="plan-price">
<span data-i18n="priceContact"></span>
</div>

<ul>
<li data-i18n="silverFeature1"></li>
<li data-i18n="silverFeature2"></li>
<li data-i18n="silverFeature3"></li>
</ul>

<button
class="btn"
onclick="startPremium('silver')"
data-i18n="choosePlan">
</button>

</div>

<div class="plan-card">

<h4>🥇 <span data-i18n="goldPlan"></span></h4>

<div class="plan-price">
<span data-i18n="priceContact"></span>
</div>

<ul>
<li data-i18n="goldFeature1"></li>
<li data-i18n="goldFeature2"></li>
<li data-i18n="goldFeature3"></li>
</ul>

<button
class="btn"
onclick="startPremium('gold')"
data-i18n="choosePlan">
</button>

</div>

</div>

<div class="note" style="margin-top:15px">
<strong>🔐</strong>
<span data-i18n="paymentSecurity"></span>
</div>

</div>

const LANGS=["ar","fr","en"];

let currentLanguage=
localStorage.getItem("thika_language")||"ar";

function t(k,vars){

  const i=LANGS.indexOf(currentLanguage);

  let s=
    (D[k]&&D[k][i])||
    (D[k]&&D[k][0])||
    k;

  if(vars){

    for(const v in vars){

      s=s.replace(
        "{"+v+"}",
        vars[v]
      );

    }

  }

  return s;
}

function escapeHtml(v){

  return String(v??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

}

function catLabel(v){

  const c=CATEGORIES.find(c=>c.v===v);

  const i=LANGS.indexOf(currentLanguage);

  return c?(c.l[i]||c.l[0]):v;

}

function fillCategories(){

  const opts=CATEGORIES
    .map(c=>
      `<option value="${c.v}">
        ${catLabel(c.v)}
      </option>`
    )
    .join("");

  document.getElementById("filterCategory").innerHTML=
    `<option value="">
      ${escapeHtml(t("allCategories"))}
    </option>`+
    opts;

  document.getElementById("category").innerHTML=opts;

}

function fillWilayas(){

  const opts=WILAYAS
    .map(w=>
      `<option value="${escapeHtml(w)}">
        ${escapeHtml(w)}
      </option>`
    )
    .join("");

  document.getElementById("filterWilaya").innerHTML=
    `<option value="">
      ${escapeHtml(t("allWilayas"))}
    </option>`+
    opts;

  document.getElementById("wilaya").innerHTML=
    `<option value="">
      ${escapeHtml(t("chooseWilaya"))}
    </option>`+
    opts;

}

function setLanguage(lang){

  if(!LANGS.includes(lang))return;

  currentLanguage=lang;

  localStorage.setItem(
    "thika_language",
    lang
  );

  document.documentElement.lang=lang;

  document.documentElement.dir=
    lang==="ar"?"rtl":"ltr";

  document.title=t("title");

  document
    .querySelectorAll("[data-i18n]")
    .forEach(e=>{
      e.textContent=t(e.dataset.i18n);
    });

  document
    .querySelectorAll("[data-i18n-ph]")
    .forEach(e=>{
      e.placeholder=t(e.dataset.i18nPh);
    });

  document
    .querySelectorAll("[data-i18n-title]")
    .forEach(e=>{
      e.title=t(e.dataset.i18nTitle);
    });

  document
    .querySelectorAll(".lang-switcher button")
    .forEach(b=>{
      b.classList.toggle(
        "active",
        b.dataset.lang===lang
      );
    });

  fillCategories();
  fillWilayas();

  updateHeader();

  renderCars();

  if(currentUser){
    loadDashboard();
  }

}

function openModal(id){

  document
    .getElementById(id)
    .classList
    .add("active");

}

function closeModal(id){

  document
    .getElementById(id)
    .classList
    .remove("active");

}

function openAdd(){

  if(!currentUser){

    openModal("loginModal");

    return;
  }

  openModal("addModal");

}

function showPage(p){

  const pages=[
    "home",
    "archive",
    "policy",
    "dashboard"
  ];

  pages.forEach(n=>{

    const el=
      document.getElementById(
        n+"Page"
      );

    if(el){

      el.style.display=
        n===p
        ?"block"
        :"none";

    }

  });

  window.scrollTo(0,0);

  if(p==="dashboard" && currentUser){

    loadDashboard();

  }

}

function showErr(id,msg,ok){

  const e=
    document.getElementById(id);

  e.innerText=msg;

  e.style.color=
    ok?"#166534":"#ef4444";

  e.style.display="block";

}

async function doLogin(){

  const email=
    document
      .getElementById("loginEmail")
      .value
      .trim()
      .toLowerCase();

  const pass=
    document
      .getElementById("loginPassword")
      .value;

  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
  ){

    return showErr(
      "loginError",
      t("badEmail")
    );

  }

  if(pass.length<6){

    return showErr(
      "loginError",
      t("shortPass")
    );

  }

  const{
    data,
    error
  }=
  await supabaseClient.auth.signInWithPassword({
    email,
    password:pass
  });

  if(error){

    return showErr(
      "loginError",
      error.message.includes("Invalid login")
      ?t("badLogin")
      :error.message
    );

  }

  currentUser=data.user;

  closeModal("loginModal");

  updateHeader();

  await loadCars();

}

function openForgotPassword(){

  closeModal("loginModal");

  document.getElementById(
    "forgotEmail"
  ).value=
    document.getElementById(
      "loginEmail"
    ).value||"";

  openModal("forgotModal");

}

async function sendPasswordReset(){

  const email=
    document
      .getElementById("forgotEmail")
      .value
      .trim()
      .toLowerCase();

  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
  ){

    return showErr(
      "forgotError",
      t("badEmail")
    );

  }

  const{
    error
  }=
  await supabaseClient.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:window.location.href
    }
  );

  if(error){

    return showErr(
      "forgotError",
      error.message
    );

  }

  showErr(
    "forgotError",
    t("resetLinkSent"),
    true
  );

}

async function updatePassword(){

  const pass=
    document
      .getElementById("newPassword")
      .value;

  if(pass.length<6){

    return showErr(
      "resetError",
      t("shortPass")
    );

  }

  const{
    error
  }=
  await supabaseClient.auth.updateUser({
    password:pass
  });

  if(error){

    return showErr(
      "resetError",
      error.message
    );

  }

  closeModal("resetModal");

  alert(t("passUpdated"));

}

async function doSignup(){

  const username=
    document
      .getElementById("signupUsername")
      .value
      .trim();

  const name=
    document
      .getElementById("signupName")
      .value
      .trim();

  const phone=
    document
      .getElementById("signupPhone")
      .value
      .trim();

  const email=
    document
      .getElementById("signupEmail")
      .value
      .trim()
      .toLowerCase();

  const pass=
    document
      .getElementById("signupPassword")
      .value;

  if(
    !username||
    !name||
    !phone||
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||
    pass.length<6
  ){

async function addCar(){

  if(!currentUser){

    openModal("loginModal");

    return;
  }

  const btn=
    document.getElementById(
      "publishBtn"
    );

  const files=
    Array.from(
      document.getElementById(
        "carImages"
      ).files
    ).slice(0,10);

  const v=id=>
    document
      .getElementById(id)
      .value
      .trim();

  const price=
    parseInt(v("price"));

  if(
    !v("brand")||
    !v("model")||
    !price||
    !v("wilaya")||
    !v("phone")
  ){

    alert(t("required"));

    return;
  }

  if(!files.length){

    alert(t("addImage"));

    return;
  }

  btn.disabled=true;

  btn.innerText=
    t("uploading");

  const urls=[];

  for(const f of files){

    const ext=
      f.name
        .split(".")
        .pop()
        .toLowerCase();

    const name=
      Date.now()+
      "-"+
      Math.random()
        .toString(36)
        .slice(2)+
      "."+
      ext;

    const{
      error
    }=
    await supabaseClient
      .storage
      .from("car-images")
      .upload(
        name,
        f
      );

    if(!error){

      urls.push(
        supabaseClient
          .storage
          .from("car-images")
          .getPublicUrl(name)
          .data
          .publicUrl
      );

    }

  }

  if(!urls.length){

    alert(t("uploadFail"));

    btn.disabled=false;

    btn.innerText=
      t("publish");

    return;
  }

  const{
    error
  }=
  await supabaseClient
    .from("cars")
    .insert({

      category:
        document
          .getElementById("category")
          .value||
        "cars",

      brand:v("brand"),

      model:v("model"),

      year:
        parseInt(v("year"))||
        null,

      mileage:
        parseInt(v("mileage"))||
        null,

      price,

      wilaya:v("wilaya"),

      fuel:
        v("fuel"),

      gearbox:
        v("gearbox"),

      phone:
        v("phone"),

      description:
        v("desc"),

      image_url:
        urls[0],

      images:
        urls,

      user_id:
        currentUser.id,

      seller_email:
        currentUser.email

      /*
        ملاحظة:
        لا نضع is_featured هنا.
        الإعلان العادي مجاني.
        الإعلان المميز يتم تفعيله
        بعد تأكيد الدفع من الخادم.
      */

    });

  btn.disabled=false;

  btn.innerText=
    t("publish");

  if(error){

    alert(error.message);

    return;
  }

  closeModal("addModal");

  document.getElementById(
    "carImages"
  ).value="";

  loadCars();

  alert(t("published"));

}

async function sendMessage(){

  if(!currentUser){

    openModal("loginModal");

    return;
  }

  const input=
    document.getElementById(
      "chatInput"
    );

  const msg=
    input.value.trim();

  if(!msg||!currentCarData)
    return;

  const car=
    currentCarData;

  const sellerId=
    car.user_id;

  const sellerEmail=
    (
      car.seller_email||
      ""
    ).toLowerCase();

  if(!sellerId||!sellerEmail){

    alert(t("noSeller"));

    return;
  }

  const isSeller=
    sellerId===currentUser.id;

  let buyerId;
  let buyerEmail;

  if(isSeller){

    buyerId=
      currentChatBuyerId;

    if(!buyerId){

      alert(t("waitBuyer"));

      return;
    }

    const{
      data:prev,
      error:pe
    }=
    await supabaseClient
      .from("messages")
      .select("buyer_email")
      .eq("car_id",car.id)
      .eq("buyer_id",buyerId)
      .limit(1);

    if(pe){

      alert(
        t("sendFail")+
        ": "+
        pe.message
      );

      return;
    }

    buyerEmail=
      prev?.[0]?.buyer_email||
      "";

  }else{

    buyerId=
      currentUser.id;

    buyerEmail=
      currentUser.email
        .toLowerCase();

  }

  if(!buyerEmail){

    alert(t("sendFail"));

    return;
  }

  const{
    data:ins,
    error
  }=
  await supabaseClient
    .from("messages")
    .insert({

      car_id:
        car.id,

      sender_id:
        currentUser.id,

      buyer_id:
        buyerId,

      seller_id:
        sellerId,

      sender_name:
        currentUser
          .user_metadata
          ?.username||
        currentUser
          .user_metadata
          ?.full_name||
        currentUser.email,

      buyer_email:
        buyerEmail,

      seller_email:
        sellerEmail,

      message:
        msg,

      is_seller:
        isSeller

    })
    .select()
    .single();

  if(error){

    alert(
      t("sendFail")+
      ": "+
      error.message
    );

    return;
  }

  currentChatBuyerId=
    buyerId;

  input.value="";

  await loadMessages(
    car.id
  );

  const ok=
    await archiveByEmail({

      buyerEmail,

      sellerEmail,

      carInfo:
        `${car.brand||""} ${car.model||""}`
          .trim(),

      message:
        msg,

      wilaya:
        car.wilaya||"",

      phone:
        car.phone||"",

      senderEmail:
        currentUser.email,

      senderName:
        currentUser
          .user_metadata
          ?.full_name||
        currentUser.email,

      sentAt:
        ins?.created_at||
        new Date().toISOString()

    });

  const box=
    document.getElementById(
      "chatMessages"
    );

  box.insertAdjacentHTML(
    "beforeend",
    `<div class="${
      ok
      ?"chat-ok"
      :"chat-error"
    }">
      ${t(
        ok
        ?"mailOk"
        :"mailFail"
      )}
    </div>`
  );

  box.scrollTop=
    box.scrollHeight;

}

function dashboardTab(tab,button){

  if(!currentUser){

    openModal("loginModal");

    return;
  }

  document
    .querySelectorAll(
      ".dashboard-section"
    )
    .forEach(s=>{
      s.classList.remove("active");
    });

  document
    .querySelectorAll(
      ".dashboard-nav"
    )
    .forEach(b=>{
      b.classList.remove("active");
    });

  const target=
    document.getElementById(
      "dash"+
      tab.charAt(0).toUpperCase()+
      tab.slice(1)
    );

  if(target)
    target.classList.add("active");

  if(button)
    button.classList.add("active");

  if(tab==="overview"){
    loadDashboard();
  }

  if(tab==="myAds"){
    renderDashboardAds();
  }

  if(tab==="messages"){
    loadDashboardMessages();
  }

  if(tab==="premium"){
    renderDashboardFeatured();
  }

  if(tab==="profile"){
    loadDashboardProfile();
  }

}

          meta.full_name||
          "—"
        )}
      </strong>

    </div>`

    +

    `<div class="profile-item">

      <small>
        ${t("email")}
      </small>

      <strong>
        ${escapeHtml(
          currentUser.email||
          "—"
        )}
      </strong>

    </div>`

    +

    `<div class="profile-item">

      <small>
        ${t("phone")}
      </small>

      <strong>
        ${escapeHtml(
          meta.phone||
          "—"
        )}
      </strong>

    </div>`;

}


/* =========================================================
   الخطط المميزة
========================================================= */

function startPremium(plan){

  if(!currentUser){

    openModal("loginModal");

    return;
  }

  alert(
    t("premiumPending")+
    "\n\n"+
    "Plan: "+
    plan
  );

  /*
    هنا سنضع لاحقًا رابط إنشاء عملية الدفع
    عبر Chargily من Edge Function.

    مثال معماري:

    frontend
       ↓
    create-payment Edge Function
       ↓
    Chargily
       ↓
    payment_url
       ↓
    user pays
       ↓
    Chargily webhook
       ↓
    verify payment
       ↓
    UPDATE cars
       SET is_featured=true,
           featured_until=...
  */

}

function upgradeAd(id){

  if(!currentUser){

    openModal("loginModal");

    return;
  }

  const car=
    (carsCache||[])
      .find(c=>
        String(c.id)===String(id)
      );

  if(!car)
    return;

  /*
    مهم:
    لا نقوم هنا بعمل:
    is_featured=true

    لأن ذلك يسمح لأي شخص بتفعيل
    الإعلان المميز من المتصفح.

    العملية الصحيحة:
    1. اختيار الخطة.
    2. إنشاء Payment عبر الخادم.
    3. الدفع في Chargily.
    4. Webhook من Chargily.
    5. التحقق من العملية.
    6. الخادم يقوم بتفعيل الإعلان.
  */

  dashboardTab(
    "premium",
    document.querySelector(
      '.dashboard-nav[onclick*="premium"]'
    )
  );

}

========================================================= */

document.getElementById(
  "filterSearch"
).value="";

document.getElementById(
  "footerContactEmail"
).textContent=
  CONTACT_EMAIL;

fillCategories();

fillWilayas();

setLanguage(
  currentLanguage
);

initAuth().then(
  loadCars
);

supabaseClient
  .auth
  .onAuthStateChange(
    (_e,s)=>{

      const id=
        s?.user?.id||
        null;

      if(
        id!==
        (currentUser?.id||null)
      ){

        currentUser=
          s?.user||null;

        updateHeader();

        loadCars();

      }

      if(
        _e===
        "PASSWORD_RECOVERY"
      ){

        openModal(
          "resetModal"
        );

      }

    }
  );
