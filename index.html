const LANGS=["ar","fr","en"];
let currentLanguage=localStorage.getItem("thika_language")||"ar";
function t(k,vars){const i=LANGS.indexOf(currentLanguage);let s=(D[k]&&D[k][i])||(D[k]&&D[k][0])||k;
  if(vars)for(const v in vars)s=s.replace("{"+v+"}",vars[v]);return s;}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

  .map((n,i)=>String(i+1).padStart(2,"0")+" - "+n);
function fillWilayas(){
  const opts=WILAYAS.map(w=>`<option value="${w}">${w}</option>`).join("");
  document.getElementById("filterWilaya").innerHTML=`<option value="" data-i18n="allWilayas"></option>`+opts;
  document.getElementById("wilaya").innerHTML=`<option value="" data-i18n="chooseWilaya"></option>`+opts;
}

function setLanguage(lang){
  if(!LANGS.includes(lang))return;
  currentLanguage=lang;localStorage.setItem("thika_language",lang);
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-title]").forEach(e=>e.title=t(e.dataset.i18nTitle));
  document.querySelectorAll(".lang-switcher button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  updateHeader();renderCars();
}

let currentUser=null,currentChatCarId=null,currentCarData=null,currentChatBuyerId=null,carsCache=null;
async function initAuth(){const{data:{session}}=await supabaseClient.auth.getSession();currentUser=session?.user||null;updateHeader();}
function updateHeader(){
  const el=document.getElementById("headerActions");
  const mail=`<span onclick="contactUs()" style="background:#EA4335;color:#fff;padding:6px 10px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:800" title="${escapeHtml(t("contact"))}">📧</span>`;
  el.innerHTML=currentUser
    ?mail+`<span class="user-chip">✅ ${escapeHtml(currentUser.user_metadata?.username||currentUser.email.slice(0,15))}</span><button class="btn btn-outline" onclick="showPage('archive')" style="font-size:11px">${t("archiveShort")}</button><button class="btn" onclick="openAdd()" style="font-size:12px">${t("addBtn")}</button><button class="btn btn-outline" onclick="logout()" style="font-size:11px">${t("logout")}</button>`
    :mail+`<button class="btn btn-outline" onclick="openModal('loginModal')">${t("login")}</button><button class="btn" onclick="openModal('signupModal')">${t("signup")}</button>`;
}
function openModal(id){document.getElementById(id).classList.add("active");}
function closeModal(id){document.getElementById(id).classList.remove("active");}
function openAdd(){if(!currentUser){openModal("loginModal");return;}openModal("addModal");}
function showPage(p){
  ["home","archive","policy"].forEach(n=>document.getElementById(n+"Page").style.display=n===p?"block":"none");
  window.scrollTo(0,0);
}
function showErr(id,msg,ok){const e=document.getElementById(id);e.innerText=msg;e.style.color=ok?"#166534":"#ef4444";e.style.display="block";}
async function doLogin(){
  const email=document.getElementById("loginEmail").value.trim().toLowerCase();
  const pass=document.getElementById("loginPassword").value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showErr("loginError",t("badEmail"));
  if(pass.length<6)return showErr("loginError",t("shortPass"));
  const{data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
  if(error)return showErr("loginError",error.message.includes("Invalid login")?t("badLogin"):error.message);
  currentUser=data.user;closeModal("loginModal");updateHeader();loadCars();
}
function openForgotPassword(){
  closeModal("loginModal");
  document.getElementById("forgotEmail").value=document.getElementById("loginEmail").value||"";
  openModal("forgotModal");
}
async function sendPasswordReset(){
  const email=document.getElementById("forgotEmail").value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showErr("forgotError",t("badEmail"));
  // الرابط اللي يوصل بالبريد يرجّع المستخدم لنفس الصفحة، ونستقبله بحدث PASSWORD_RECOVERY تحت
  const{error}=await supabaseClient.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});
  if(error)return showErr("forgotError",error.message);
  showErr("forgotError",t("resetLinkSent"),true);
}
async function updatePassword(){
  const pass=document.getElementById("newPassword").value;
  if(pass.length<6)return showErr("resetError",t("shortPass"));
  const{error}=await supabaseClient.auth.updateUser({password:pass});
  if(error)return showErr("resetError",error.message);
  closeModal("resetModal");
  alert(t("passUpdated"));
}
async function doSignup(){
  const username=document.getElementById("signupUsername").value.trim();
  const name=document.getElementById("signupName").value.trim();
  const phone=document.getElementById("signupPhone").value.trim();
  const email=document.getElementById("signupEmail").value.trim().toLowerCase();
  const pass=document.getElementById("signupPassword").value;
  if(!username||!name||!phone||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||pass.length<6)return showErr("signupError",t("fillData"));
  const{data,error}=await supabaseClient.auth.signUp({email,password:pass,options:{data:{full_name:name,username,phone}}});
  if(error)return showErr("signupError",error.message);
  currentUser=data.session?.user||null;
  if(currentUser){closeModal("signupModal");updateHeader();loadCars();}else showErr("signupError",t("checkMail"),true);
}
async function logout(){await supabaseClient.auth.signOut();currentUser=null;updateHeader();loadCars();}

/* ---------- الإعلانات ---------- */
async function loadCars(){
  const{data,error}=await supabaseClient.from("cars").select("*").order("created_at",{ascending:false});
  if(error){document.getElementById("status").innerText="❌ "+error.message;return;}
  carsCache=data;renderCars();
}
function renderCars(){
  if(!carsCache)return;
  const wilaya=document.getElementById("filterWilaya").value;
  const q=document.getElementById("filterSearch").value.trim().toLowerCase();
  const list=carsCache.filter(c=>(!wilaya||c.wilaya===wilaya)&&(!q||[c.brand,c.model,c.description].join(" ").toLowerCase().includes(q)));
  document.getElementById("status").innerText=t("count",{n:list.length});
  document.getElementById("carsGrid").innerHTML=list.length?list.map(c=>{
    const img=c.image_url||c.images?.[0]||"https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=500";
    const own=currentUser&&c.user_id===currentUser.id;
    return `<div class="card"><img src="${escapeHtml(img)}" alt="${escapeHtml(c.brand+" "+c.model)}"><div class="card-body">
<div style="font-weight:900">${escapeHtml(c.brand)} ${escapeHtml(c.model)}</div>
<div class="price">${Number(c.price).toLocaleString()} دج</div>
<div class="meta">📍 ${escapeHtml(c.wilaya||"")}${c.year?" | "+escapeHtml(c.year):""}${c.mileage?" | "+Number(c.mileage).toLocaleString()+" km":""}</div>
<button class="btn" onclick="openChat(${Number(c.id)})" style="width:100%;margin-top:8px">${t("chat")}</button>
${own?`<button class="btn btn-delete" onclick="deleteCar(${Number(c.id)})" style="width:100%;margin-top:8px">${t("delete")}</button><div class="meta" style="text-align:center">${t("ownerNote")}</div>`:""}
</div></div>`;}).join(""):`<p style="grid-column:1/-1;text-align:center;padding:40px">${t("noCars")}</p>`;
}
async function deleteCar(id){
  if(!currentUser){alert(t("loginRequired"));return;}
  if(!confirm(t("confirmDelete")))return;
  // الحماية الحقيقية: RLS policy على DELETE  (auth.uid() = user_id)
  const{error}=await supabaseClient.from("cars").delete().eq("id",id).eq("user_id",currentUser.id);
  if(error){alert(t("deleteFailed")+": "+error.message);return;}
  alert(t("deleted"));loadCars();
}
async function addCar(){
  if(!currentUser){openModal("loginModal");return;}
  const btn=document.getElementById("publishBtn");
  const files=Array.from(document.getElementById("carImages").files).slice(0,10);
  const v=id=>document.getElementById(id).value.trim();
  const price=parseInt(v("price"));
  if(!v("brand")||!v("model")||!price||!v("wilaya")||!v("phone")){alert(t("required"));return;}
  if(!files.length){alert(t("addImage"));return;}
  btn.disabled=true;btn.innerText=t("uploading");
  const urls=[];
  for(const f of files){
    const name=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+f.name.split(".").pop();
    const{error}=await supabaseClient.storage.from("car-images").upload(name,f);
    if(!error)urls.push(supabaseClient.storage.from("car-images").getPublicUrl(name).data.publicUrl);
  }
  if(!urls.length){alert(t("uploadFail"));btn.disabled=false;btn.innerText=t("publish");return;}
  const{error}=await supabaseClient.from("cars").insert({
    brand:v("brand"),model:v("model"),year:parseInt(v("year"))||null,mileage:parseInt(v("mileage"))||null,price,
    wilaya:v("wilaya"),fuel:v("fuel"),gearbox:v("gearbox"),phone:v("phone"),description:v("desc"),
    image_url:urls[0],images:urls,user_id:currentUser.id,seller_email:currentUser.email
  });
  btn.disabled=false;btn.innerText=t("publish");
  if(error){alert(error.message);return;}
  closeModal("addModal");loadCars();alert(t("published"));
}

/* ---------- المحادثة ---------- */
async function openChat(carId){
  if(!currentUser){openModal("loginModal");return;}
  const{data:car,error}=await supabaseClient.from("cars").select("*").eq("id",carId).single();
  if(error||!car){alert(t("loadFail"));return;}
  currentChatCarId=car.id;currentCarData=car;currentChatBuyerId=null;
  document.getElementById("chatCarTitle").innerText=`${car.brand} ${car.model}`;
  openModal("chatModal");
  await loadMessages(car.id);
}
async function loadMessages(carId){
  const{data,error}=await supabaseClient.from("messages").select("*").eq("car_id",carId).order("created_at",{ascending:true});
  const box=document.getElementById("chatMessages");
  if(error){box.innerHTML=`<div class="chat-error">❌ ${t("loadFail")}: ${escapeHtml(error.message)}</div>`;return;}
  if(!data.length){currentChatBuyerId=null;box.innerHTML=`<div class="msg system">${t("noMsgs")}</div>`;return;}
  currentChatBuyerId=(data.find(m=>m.buyer_id)||{}).buyer_id||null;
  const loc=currentLanguage==="ar"?"ar-DZ":currentLanguage==="fr"?"fr-DZ":"en-DZ";
  box.innerHTML=data.map(m=>{
    const mine=m.sender_id===currentUser.id;
    return `<div class="msg ${mine?"me":"other"}"><strong>${mine?t("me"):escapeHtml(m.sender_name||t("other"))}:</strong> ${escapeHtml(m.message)}<br><small>🕒 ${escapeHtml(new Date(m.created_at).toLocaleString(loc))}</small></div>`;
  }).join("");
  box.scrollTop=box.scrollHeight;
}
/* الأرشفة: جدول messages هو المرجع، ودالة Edge باسم resend-email ترسل نسخة بريدية للطرفين.
   لا وصول إلى Gmail. الأفضل أن تجلب الدالة الإيميلات من قاعدة البيانات بدل أخذها من العميل. */
async function archiveByEmail(p){
  try{
    const{error}=await supabaseClient.functions.invoke("resend-email",{body:{...p,subject:`Thika Auto .dz — ${p.carInfo}`}});
    if(error)throw error;return true;
  }catch(e){console.error("archive email error:",e);return false;}
}
function sendQuickMessage(){
  document.getElementById("chatInput").value=t("quickAvailableMsg");
  sendMessage();
}
async function sendMessage(){
  if(!currentUser){openModal("loginModal");return;}
  const input=document.getElementById("chatInput");
  const msg=input.value.trim();
  if(!msg||!currentCarData)return;
  const car=currentCarData;
  const sellerId=car.user_id,sellerEmail=(car.seller_email||"").toLowerCase();
  if(!sellerId||!sellerEmail){alert(t("noSeller"));return;}
  const isSeller=sellerId===currentUser.id;
  let buyerId,buyerEmail;
  if(isSeller){
    buyerId=currentChatBuyerId;
    if(!buyerId){alert(t("waitBuyer"));return;}
    const{data:prev,error:pe}=await supabaseClient.from("messages").select("buyer_email").eq("car_id",car.id).eq("buyer_id",buyerId).limit(1);
    if(pe){alert(t("sendFail")+": "+pe.message);return;}
    buyerEmail=prev?.[0]?.buyer_email||"";
  }else{buyerId=currentUser.id;buyerEmail=currentUser.email.toLowerCase();}
  if(!buyerEmail){alert(t("sendFail"));return;}
  const{data:ins,error}=await supabaseClient.from("messages").insert({
    car_id:car.id,sender_id:currentUser.id,buyer_id:buyerId,seller_id:sellerId,
    sender_name:currentUser.user_metadata?.username||currentUser.user_metadata?.full_name||currentUser.email,
    buyer_email:buyerEmail,seller_email:sellerEmail,message:msg,is_seller:isSeller
  }).select().single();
  if(error){alert(t("sendFail")+": "+error.message);return;}
  currentChatBuyerId=buyerId;input.value="";
  await loadMessages(car.id);
  const ok=await archiveByEmail({buyerEmail,sellerEmail,carInfo:`${car.brand||""} ${car.model||""}`.trim(),message:msg,wilaya:car.wilaya||"",phone:car.phone||"",senderEmail:currentUser.email,senderName:currentUser.user_metadata?.full_name||currentUser.email,sentAt:ins?.created_at||new Date().toISOString()});
  const box=document.getElementById("chatMessages");
  box.insertAdjacentHTML("beforeend",`<div class="${ok?"chat-ok":"chat-error"}">${t(ok?"mailOk":"mailFail")}</div>`);
  box.scrollTop=box.scrollHeight;
}

async function searchArchive(){
  if(!currentUser){openModal("loginModal");return;}
  const q=document.getElementById("archiveSearch").value.trim().toLowerCase();
  // RLS على جدول messages يجب أن يحصر القراءة في المشتري والبائع
  const{data,error}=await supabaseClient.from("messages").select("*,cars(brand,model)")
    .or(`buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`).order("created_at",{ascending:false}).limit(100);
  const out=document.getElementById("archiveResults");
  if(error){out.innerHTML=`<div class="chat-error">${escapeHtml(error.message)}</div>`;return;}
  const rows=data.filter(m=>!q||(m.message+" "+(m.cars?.brand||"")+" "+(m.cars?.model||"")).toLowerCase().includes(q));
  const loc=currentLanguage==="ar"?"ar-DZ":currentLanguage==="fr"?"fr-DZ":"en-DZ";
  out.innerHTML=`<p>${t("archiveCount",{n:rows.length})}</p>`+rows.map(m=>`<div class="box" style="font-size:11px;padding:10px;margin:6px 0"><b>${escapeHtml(m.cars?.brand||"")} ${escapeHtml(m.cars?.model||"")}</b> - ${escapeHtml(new Date(m.created_at).toLocaleString(loc))}<br>${escapeHtml(m.message)}<br><small>📧 ${escapeHtml(m.buyer_email)} → ${escapeHtml(m.seller_email)}</small></div>`).join("");
}
function contactUs(){
  window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${CONTACT_EMAIL}&su=${encodeURIComponent("Thika Auto .dz")}`,"_blank");
}

/* ---------- التشغيل ---------- */
document.getElementById("footerContactEmail").textContent=CONTACT_EMAIL;
fillWilayas();
setLanguage(currentLanguage);
initAuth().then(loadCars);
supabaseClient.auth.onAuthStateChange((_e,s)=>{
  const id=s?.user?.id||null;
  if(id!==(currentUser?.id||null)){currentUser=s?.user||null;updateHeader();loadCars();}
  if(_e==="PASSWORD_RECOVERY"){openModal("resetModal");}
});
</script>
